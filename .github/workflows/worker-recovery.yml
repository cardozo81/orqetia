name: Worker recovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-18:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: orqetia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orqetia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ORQETIA_ENVIRONMENT: test
      ORQETIA_PROCESS_ROLE: worker
      ORQETIA_DATABASE_DSN: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/orqetia_test
      ORQETIA_SECRET_STORE_MODE: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Reproduce locked Python 3.14 development environment
        run: uv sync --locked --python 3.14

      - name: Provider attempt contract tests
        run: |
          uv run --no-sync --python 3.14 python -m unittest \
            tests.execution.test_attempt_contract \
            -v

      - name: Apply Alembic migrations
        run: uv run --no-sync --python 3.14 alembic upgrade head

      - name: Worker recovery PostgreSQL integration tests
        run: |
          uv run --no-sync --python 3.14 python -m unittest \
            tests.processes.test_provider_attempt_recovery \
            tests.processes.test_task_orchestration_worker \
            tests.processes.test_worker_composition \
            tests.execution.test_orchestration_policy \
            -v

      - name: Runtime quota integration tests
        run: >-
          uv run --no-sync --python 3.14 pytest -q
          tests/usage_accounting/test_runtime_quota_integration.py
