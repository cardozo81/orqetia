name: Pre-RC security pack

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - docs/security/pre-rc-security-regression-pack.md
      - tests/security/test_pre_rc_security_pack.py
      - .github/workflows/pre-rc-security-pack.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-rc-security-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-rc-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Reproduce locked Python 3.14 development environment
        run: uv sync --locked --python 3.14
      - name: Verify pack contract
        run: uv run --no-sync --python 3.14 pytest -q tests/security/test_pre_rc_security_pack.py
      - name: Run targeted security controls
        run: |
          uv run --no-sync --python 3.14 pytest -q             tests/identity/test_customer_authz.py::test_browser_selected_owner_cannot_escape_exact_membership             tests/portal/test_customer_portal_security_shell.py::test_customer_portal_rejects_cross_origin_mutation             tests/identity/test_customer_authz.py::test_credential_write_requires_recent_mfa_but_read_does_not             tests/identity/test_client_credentials.py::test_issue_idempotency_replays_without_revealing_secret_again             tests/control_plane/test_provider_catalog_admin.py::test_endpoint_metadata_is_admin_only_and_rejects_unsafe_urls             tests/api/test_abuse_controls.py::test_body_and_complexity_limits_fail_closed             tests/api/test_abuse_controls.py::test_http_rate_limit_emits_retry_after_without_identity_leak             tests/api/test_client_credentials.py::test_client_cannot_mint_scope_it_does_not_hold             tests/contracts/test_exchange_evidence_reference.py::ExchangeEvidenceCarryoverTests::test_secret_is_sanitized_before_persistence             tests/contracts/test_exchange_evidence_reference.py::ExchangeEvidenceCarryoverTests::test_client_evidence_dto_contains_no_provider_financial_or_secret_fields             tests/audit/test_immutable_audit.py::test_audit_is_append_only_and_integrity_is_reconciled             tests/security/test_supply_chain.py::test_provenance_verifies_sbom_and_locked_materials
