name: Temporary lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Generate refreshed lockfile
        run: |
          uv lock
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path("uv.lock").read_bytes()).decode("ascii")
          print("UV_LOCK_REFRESH_B64_BEGIN")
          print(data)
          print("UV_LOCK_REFRESH_B64_END")
          PY
          exit 1
