name: Security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Reproduce locked Python 3.14 runtime install
        run: uv sync --locked --no-dev --python 3.14

      - name: Repository security policy checks
        run: uv run --no-sync --python 3.14 python scripts/security_baseline_check.py

      - name: Canonical revalidation gate
        run: |
          uv run --no-sync --python 3.14 python -m unittest \
            tests.characterization.test_canonical_contract \
            tests.contracts.test_attempt_operation_reference \
            tests.contracts.test_exchange_evidence_reference \
            tests.contracts.test_execution_target_reference \
            -v

      - name: Tenant target envelope revalidation tests
        run: uv run --no-sync --python 3.14 python -m unittest tests.contracts.test_tenancy_target_reference -v

      - name: Explicit target authorization revalidation tests
        run: uv run --no-sync --python 3.14 python -m unittest tests.contracts.test_authz_target_reference -v

      - name: Client OpenAPI v1 contract tests
        run: uv run --no-sync --python 3.14 python -m unittest tests.contracts.test_openapi_v1_contract -v
