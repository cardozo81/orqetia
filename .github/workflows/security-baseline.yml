name: Security baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository security policy checks
        run: python3 scripts/security_baseline_check.py

      - name: Canonical revalidation gate
        run: |
          python3 -m unittest \
            tests.characterization.test_canonical_contract \
            tests.contracts.test_attempt_operation_reference \
            tests.contracts.test_exchange_evidence_reference \
            tests.contracts.test_execution_target_reference \
            -v

      - name: Tenant target envelope revalidation tests
        run: python3 -m unittest tests.contracts.test_tenancy_target_reference -v

      - name: Explicit target authorization revalidation tests
        run: python3 -m unittest tests.contracts.test_authz_target_reference -v

      - name: Client OpenAPI v1 contract tests
        run: python3 -m unittest tests.contracts.test_openapi_v1_contract -v
