name: Local Compose

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate rendered Compose contract
        run: |
          docker compose version
          docker compose config --quiet
          docker compose config --format json | python3 scripts/verify_compose_config.py
          python3 -m unittest tests.devenv.test_compose_contract -v

      - name: Build locked non-root runtime image
        run: docker compose build

      - name: Start all local processes and wait for health
        run: docker compose up -d --wait --wait-timeout 120

      - name: Install locked acceptance dependencies
        run: |
          python3 -m pip install --disable-pip-version-check "uv==0.10.0"
          uv sync --locked --python 3.14

      - name: Real HTTPS acceptance, restart and persistent down/up
        run: uv run --no-sync --python 3.14 python scripts/accept_local.py --with-recovery

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
