name: Client API manual

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"
      - run: uv sync --locked --python 3.14
      - name: Manual/OpenAPI parity
        run: >-
          uv run --no-sync --python 3.14 pytest -q
          tests/docs/test_client_api_manual.py
