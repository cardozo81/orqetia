name: Operational runbook drills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - docs/runbooks/operational-recovery.md
      - tests/ops/test_operational_runbooks.py
      - .github/workflows/operational-runbooks.yml

permissions:
  contents: read

concurrency:
  group: operational-runbooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-runbooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: orqetia_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orqetia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORQETIA_ENVIRONMENT: test
      ORQETIA_PROCESS_ROLE: worker
      ORQETIA_DATABASE_DSN: postgresql+psycopg://postgres@127.0.0.1:5432/orqetia_test
      ORQETIA_SECRET_STORE_MODE: none
      ORQETIA_RESTORE_SOURCE_URL: postgresql://postgres@127.0.0.1:5432/orqetia_test
      ORQETIA_RESTORE_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Reproduce locked Python 3.14 development environment
        run: uv sync --locked --python 3.14
      - name: Apply migrations
        run: uv run --no-sync --python 3.14 alembic upgrade head
      - name: Run runbook contract
        run: uv run --no-sync --python 3.14 pytest -q tests/ops/test_operational_runbooks.py
      - name: Drill readiness degradation
        run: >-
          uv run --no-sync --python 3.14 python -m unittest
          tests.ops.test_availability_policy.AvailabilityPolicyTests.test_provider_outage_is_degraded_and_database_outage_not_ready
          -v
      - name: Drill queue reclaim ambiguity
        run: >-
          uv run --no-sync --python 3.14 python -m unittest
          tests.processes.test_provider_attempt_recovery.ProviderAttemptRecoveryIntegrationTests.test_orphan_dispatch_becomes_ambiguous_without_redispatch
          -v
      - name: Drill provider credential rotation failure
        run: >-
          uv run --no-sync --python 3.14 pytest -q
          tests/control_plane/test_provider_credentials.py::test_rotation_persistence_failure_preserves_old_secret_and_metadata
      - name: Drill tenant isolation
        run: >-
          uv run --no-sync --python 3.14 pytest -q
          tests/identity/test_customer_authz.py::test_browser_selected_owner_cannot_escape_exact_membership
      - name: Drill schema incompatibility detection
        run: >-
          uv run --no-sync --python 3.14 pytest -q
          tests/contracts/test_schema_compatibility.py::test_required_property_change_is_breaking
      - name: Drill security incident contract
        run: >-
          uv run --no-sync --python 3.14 pytest -q
          tests/security/test_incident_response_docs.py::test_incident_response_policy_covers_issue_57_contract
      - name: Drill PostgreSQL restore
        run: bash scripts/postgres_restore_drill.sh
