name: PostgreSQL restore drill

on:
  pull_request:
    branches: [main]
    paths:
      - docs/operations/backup-restore-dr.md
      - scripts/postgres_restore_drill.sh
      - .github/workflows/postgres-restore-drill.yml
  push:
    branches: [main]
    paths:
      - docs/operations/backup-restore-dr.md
      - scripts/postgres_restore_drill.sh
      - .github/workflows/postgres-restore-drill.yml

permissions:
  contents: read

concurrency:
  group: postgres-restore-drill-main
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: orqetia_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orqetia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORQETIA_ENVIRONMENT: test
      ORQETIA_PROCESS_ROLE: worker
      ORQETIA_DATABASE_DSN: postgresql+psycopg://postgres@127.0.0.1:5432/orqetia_test
      ORQETIA_SECRET_STORE_MODE: none
      ORQETIA_RESTORE_SOURCE_URL: postgresql://postgres@127.0.0.1:5432/orqetia_test
      ORQETIA_RESTORE_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"
      - name: Install locked runtime
        run: uv sync --locked --no-dev --python 3.14
      - name: Apply PostgreSQL migrations
        run: uv run --no-sync --python 3.14 alembic upgrade head
      - name: Run isolated restore drill
        run: bash scripts/postgres_restore_drill.sh
