name: Branch release governance

on:
  pull_request:
    branches: [main]
    paths:
      - docs/governance/branch-release-protection-policy.md
      - tests/governance/test_branch_release_policy.py
      - .github/workflows/branch-release-governance.yml
  push:
    branches: [main]
    paths:
      - docs/governance/branch-release-protection-policy.md
      - tests/governance/test_branch_release_policy.py
      - .github/workflows/branch-release-governance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-release-governance-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Reproduce locked Python 3.14 development environment
        run: uv sync --locked --python 3.14
      - name: Verify branch/release policy
        run: uv run --no-sync --python 3.14 pytest -q tests/governance/test_branch_release_policy.py
