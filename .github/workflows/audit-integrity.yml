name: Audit integrity

on:
  pull_request:
    branches: [main]
    paths:
      - src/orqetia/audit/**
      - migrations/versions/20261006_0031_immutable_audit.py
      - docs/security/audit-retention-integrity.md
      - tests/audit/test_immutable_audit.py
      - .github/workflows/audit-integrity.yml
  push:
    branches: [main]
    paths:
      - src/orqetia/audit/**
      - migrations/versions/20261006_0031_immutable_audit.py
      - docs/security/audit-retention-integrity.md
      - tests/audit/test_immutable_audit.py
      - .github/workflows/audit-integrity.yml

permissions:
  contents: read

concurrency:
  group: audit-integrity-main
  cancel-in-progress: true

jobs:
  immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: orqetia_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orqetia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ORQETIA_ENVIRONMENT: test
      ORQETIA_PROCESS_ROLE: api
      ORQETIA_DATABASE_DSN: postgresql+psycopg://postgres@127.0.0.1:5432/orqetia_test
      ORQETIA_SECRET_STORE_MODE: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"
      - name: Install locked test environment
        run: uv sync --locked --python 3.14
      - name: Apply PostgreSQL migrations
        run: uv run --no-sync --python 3.14 alembic upgrade head
      - name: Immutable audit test
        run: uv run --no-sync --python 3.14 pytest -q tests/audit/test_immutable_audit.py
