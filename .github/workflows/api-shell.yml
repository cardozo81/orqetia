name: API shell

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv bootstrap tool
        run: python3 -m pip install --disable-pip-version-check "uv==0.10.0"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Reproduce locked Python 3.14 runtime install
        run: uv sync --locked --no-dev --python 3.14

      - name: Canonical OpenAPI safety tests
        run: |
          uv run --no-sync --python 3.14 python -m unittest \
            tests.contracts.test_openapi_v1_contract \
            -v

      - name: FastAPI shell contract tests
        run: |
          uv run --no-sync --python 3.14 python -m unittest \
            tests.api.test_fastapi_shell \
            -v
