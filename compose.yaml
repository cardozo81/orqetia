name: orqetia-local

x-runtime-environment: &runtime-environment
  ORQETIA_ENVIRONMENT: local
  ORQETIA_DATABASE_DSN: "postgresql+psycopg://orqetia:synthetic-local-only@postgres:5432/orqetia"
  ORQETIA_SECRET_STORE_MODE: local
  ORQETIA_WORKER_CONCURRENCY: "4"
  ORQETIA_WORK_LEASE_SECONDS: "60"
  ORQETIA_QUEUE_POLL_INTERVAL_SECONDS: "1"
  ORQETIA_SHUTDOWN_GRACE_SECONDS: "30"

x-runtime-service: &runtime-service
  image: orqetia-local-runtime:dev
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  networks:
    - runtime

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: orqetia
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: orqetia
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqetia -d orqetia"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - runtime

  api:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      ORQETIA_PROCESS_ROLE: api
      ORQETIA_DEBUG: "true"
      ORQETIA_PUBLIC_BASE_URL: "http://127.0.0.1:8000"
      ORQETIA_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ORQETIA_TRUSTED_PROXY_CIDRS: '["127.0.0.1/32","::1/128"]'
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]

  worker:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      ORQETIA_PROCESS_ROLE: worker
    command: ["python", "/app/scripts/dev_container_process.py", "worker"]

  scheduler:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      ORQETIA_PROCESS_ROLE: scheduler
    command: ["python", "/app/scripts/dev_container_process.py", "scheduler"]

  migrate:
    <<: *runtime-service
    environment:
      <<: *runtime-environment
      ORQETIA_PROCESS_ROLE: worker
    command: ["alembic", "upgrade", "head"]

volumes:
  postgres_data:

networks:
  runtime:
    driver: bridge
