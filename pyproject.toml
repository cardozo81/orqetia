[project]
name = "orqetia"
version = "0.1.0.dev0"
description = "Provider-neutral canonical AI orchestration service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.20,<1.21",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.1,<2.2",
  "uvicorn[standard]>=0.46,<0.47",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orqetia"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["orqetia"]
mypy_path = "src"
